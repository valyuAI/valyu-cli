# Security-hardened CI/CD pipeline for @valyu/cli
#
# Key security measures:
# - All actions pinned to exact SHA hashes (prevents tag hijacking attacks like tj-actions/changed-files March 2025)
# - Workflow-level permissions deny-by-default, granted per-job with least privilege
# - Runner OS pinned to specific version (not 'latest')
# - npm version pinned (not @latest)
# - Lockfile integrity enforced (--frozen-lockfile)
# - npm audit for known vulnerabilities
# - OIDC trusted publishing (no long-lived npm tokens)
# - Provenance attestation on published packages

name: Build, Test & Publish

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Deny all permissions by default - each job grants only what it needs
permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Pin to SHA: actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Pin to SHA: actions/setup-node@v4.4.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --prod || true

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  publish:
    # Only publish on push to main (not PRs)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write  # Required for OIDC trusted publishing
    environment: npm
    steps:
      # Pin to SHA: actions/checkout@v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Pin to SHA: actions/setup-node@v4.4.0
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install npm with OIDC support
        run: npm i -g npm@11.4.1

      - name: Install pnpm
        run: npm install -g pnpm@10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check if version already published
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@valyu/cli@$VERSION" version 2>/dev/null; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Publish with provenance
        if: steps.check.outputs.skip == 'false'
        run: npm publish --provenance --access public
